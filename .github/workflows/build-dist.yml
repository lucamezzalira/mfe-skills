name: Build distributions

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'scripts/**'
      - '.github/workflows/build-dist.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate skills
        run: node scripts/validate.js

      - name: Build Cursor rules and AGENTS.md
        run: npm run build

      - name: Smoke test
        run: npm run test

      - name: Commit generated files (push to main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .cursor/rules/ AGENTS.md
          git diff --staged --quiet || git commit -m "chore: rebuild .cursor/rules and AGENTS.md from skills/"
          git push
